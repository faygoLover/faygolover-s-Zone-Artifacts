modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
credits="faygolover"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# FL Render: the shaders, the late pass after a shader pack, the anomalies' light and the graphics settings
# (Options > Video Settings > FL Render). Client only.
[[dependencies.${mod_id}]]
    modId="flrender"
    mandatory=true
    versionRange="[0.1.0,)"
    ordering="AFTER"
    side="CLIENT"
